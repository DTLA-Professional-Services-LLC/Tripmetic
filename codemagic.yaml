# Codemagic: App Store distribution signing (no registered devices required).
# In the Codemagic UI: Applications → Tripmetic → enable "codemagic.yaml" / use this workflow
# if your Default Workflow still requests IOS_APP_DEVELOPMENT.
#
# https://docs.codemagic.io/yaml-code-signing/signing-ios/

workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tripmetic.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
