# Codemagic: App Store distribution signing (no registered devices required).
# In the Codemagic UI: Applications → Tripmetic → enable "codemagic.yaml" / use this workflow
# if your Default Workflow still requests IOS_APP_DEVELOPMENT.
#
# https://docs.codemagic.io/yaml-code-signing/signing-ios/
# https://docs.codemagic.io/yaml-publishing/app-store-connect/
#
# Environment variables (Application or team group — mark secrets):
#   APP_STORE_CONNECT_PRIVATE_KEY   — full .p8 text (App Store Connect API key, NOT IAP key)
#   APP_STORE_CONNECT_KEY_IDENTIFIER — Key ID from App Store Connect → Users and Access → Keys
#   APP_STORE_CONNECT_ISSUER_ID      — Issuer ID (same Keys page)
#
# Create the API key: App Store Connect → Users and Access → Integrations → App Store Connect API
# → + → Name e.g. Codemagic → Access: App Manager → Generate → Download .p8 once.

workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tripmetic.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Verify Firebase iOS config (optional)
        script: |
          set -e
          if [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "WARNING: ios/Runner/GoogleService-Info.plist is missing from the repo clone." >&2
            echo "Firebase iOS may not initialize; add the file from Firebase Console or inject it in CI." >&2
          fi
      # Do NOT set testFlightInternalTestingOnly:true here — that marks the IPA for
      # internal TestFlight only and App Store Connect will reject attaching it to a
      # store version (red Save / disabled Add for Review). Use a separate workflow
      # with that flag only if you want internal-only builds.
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          set -e
          flutter build ipa --release --dart-define=REVENUECAT_IOS_PUBLIC_API_KEY=appl_gUxCUkDxRbGwQHcDLLXNzUFRTmd
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
