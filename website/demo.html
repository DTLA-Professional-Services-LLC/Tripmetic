    <style>
        .page-header { background-color: var(--navy); color: white; padding: 80px 0 60px; text-align: center; }
        .page-header h1 { font-size: 3rem; margin-bottom: 15px; color: var(--gold); }
        .page-header p { color: #b0b8d1; font-size: 1.2rem; max-width: 600px; margin: 0 auto; }

        /* Gallery Grid Setup */
        .gallery-section { padding: 60px 0 100px; }
        .gallery-grid {
            display: grid;
            /* Auto-fit creates responsive columns based on screen size */
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }

        /* Individual Image Cards */
        .gallery-item {
            background: var(--navy);
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-color: var(--gold);
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: contain;
            /* Forces vertical aspect ratio rendering */
            aspect-ratio: auto; 
        }

        /* Lightbox (Modal) Styles */
        .lightbox {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 9999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(11, 19, 43, 0.95); /* Deep navy transparent background */
            backdrop-filter: blur(5px);
        }
        .lightbox-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh; /* Prevents vertical images from going off screen */
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 35px;
            color: var(--white);
            font-size: 50px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .close-btn:hover, .close-btn:focus { color: var(--gold); }

        @keyframes zoomIn {
            from {transform:scale(0.9); opacity: 0;}
            to {transform:scale(1); opacity: 1;}
        }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            .lightbox-content { max-width: 95%; max-height: 80vh; }
        }
    </style>

    <div id="imageLightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img class="lightbox-content" id="expandedImg" loading="lazy" decoding="async">
    </div>

    <script>
        var modalBox = document.getElementById("imageLightbox");
        var modalImg = document.getElementById("expandedImg");
        var images = document.querySelectorAll(".gallery-img");
        
        images.forEach(function(img) {
            img.onclick = function(){
                modalBox.style.display = "block";
                modalImg.src = this.src;
            }
        });

        var span = document.getElementsByClassName("close-btn")[0];

        span.onclick = function() { 
            modalBox.style.display = "none";
        }

        modalBox.onclick = function(e) {
            if (e.target !== modalImg) {
                modalBox.style.display = "none";
            }
        }
    </script>

    <div id="footer-placeholder"></div>

    <script>
        // Fetch the Top Menu
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading menu:', error));

        // Fetch the Footer (which contains the Modal)
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;

                // Activate the Modal logic ONLY after footer is loaded
                const downloadModal = document.getElementById('downloadModal');
                if (downloadModal) {
                    const closeBtn = downloadModal.querySelector('.close-modal');

                    // Listen for clicks on ANY link that points to #download
                    document.body.addEventListener('click', function(e) {
                        const downloadLink = e.target.closest('a[href="#download"]');
                        if (downloadLink) {
                            e.preventDefault();
                            downloadModal.style.display = 'flex';
                        }
                    });

                    // Close the modal when the "X" is clicked
                    closeBtn.addEventListener('click', function() {
                        downloadModal.style.display = 'none';
                    });

                    // Close the modal when clicking the dark background outside the box
                    window.addEventListener('click', function(e) {
                        if (e.target === downloadModal) {
                            downloadModal.style.display = 'none';
                        }
                    });
                }
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
